# Nginx Configuration for SmartRentDZ API
# Production reverse proxy setup

upstream smartrentdz_api {
    # Load balancing across multiple Gunicorn workers
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.smartrentdz.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name api.smartrentdz.com;
    
    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.smartrentdz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smartrentdz.com/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logging
    access_log /var/log/nginx/smartrentdz-access.log;
    error_log /var/log/nginx/smartrentdz-error.log;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain application/json;
    gzip_min_length 1000;
    
    # Buffer sizes
    client_max_body_size 10M;
    
    location / {
        proxy_pass http://smartrentdz_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # API health check endpoint (cacheable)
    location /health {
        proxy_pass http://smartrentdz_api;
        proxy_cache_valid 200 5s;
        access_log off;
    }
}
